# OTA Client Configuration File
# This file is read by ota_client on startup

# OTA Server URL (where new IFS files are hosted)
OTA_SERVER=http://192.168.50.148:8080

# Check interval in seconds (how often to check for updates)
OTA_CHECK_INTERVAL=300

# Enable/Disable OTA (1 = enabled, 0 = disabled)
OTA_ENABLED=1

# Boot partition path (where config.txt is located)
BOOT_PATH=/var/boot

# Version file path (format: YYYY.WW.N, e.g. 2026.18.1)
VERSION_FILE=/var/boot/ota_version

# Config file path (to update kernel parameter)
CONFIG_FILE=/var/boot/config.txt

# Log file path
LOG_FILE=/tmp/ota_client.log
